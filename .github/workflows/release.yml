name: Production Release Matrix

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # 1. Verification and Static Analysis
  # --------------------------------------------------------------------------
  verify:
    name: Verify Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze --fatal-infos

      - name: Run Test Suite
        run: flutter test

  # --------------------------------------------------------------------------
  # 2. Android Build (APK & AAB)
  # --------------------------------------------------------------------------
  build-android:
    name: Build Android (APK & AAB)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Keystore (from secrets if present)
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_FILE: ${{ secrets.ANDROID_STORE_FILE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$STORE_FILE" ]; then
            echo "$STORE_FILE" | base64 -d > android/app/upload.keystore
          fi

      - name: Build Release APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.PUBLIC_SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build Release App Bundle (AAB)
        run: flutter build appbundle --release --dart-define=SUPABASE_URL=${{ secrets.PUBLIC_SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  # --------------------------------------------------------------------------
  # 3. Linux Build (AppDir & Tarball)
  # --------------------------------------------------------------------------
  build-linux:
    name: Build Linux
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Package Linux
        run: ./scripts/package_linux.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-artifacts
          path: dist/linux/organiza-linux-x86_64.tar.gz

  # --------------------------------------------------------------------------
  # 4. Windows Build (Installer)
  # --------------------------------------------------------------------------
  build-windows:
    name: Build Windows
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: build/windows/x64/runner/Release/

  # --------------------------------------------------------------------------
  # 5. SBOM, Checksums & Draft GitHub Release
  # --------------------------------------------------------------------------
  release:
    name: Publish Release & SBOM
    needs: [build-android, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-artifacts
          path: dist/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release-artifacts
          path: dist/

      - name: Generate SBOM
        run: ./scripts/generate_sbom.sh dist/organiza-sbom.json

      - name: Generate SHA-256 Checksums
        run: ./scripts/generate_checksums.sh dist

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*
          body: |
            ## Organiza Production Release ${{ github.ref_name }}
            
            ### Artifacts Included
            - Android APK (`app-release.apk`)
            - Android App Bundle (`app-release.aab`)
            - Linux Tarball (`organiza-linux-x86_64.tar.gz`)
            - Software Bill of Materials (`organiza-sbom.json`)
            - SHA-256 Checksums (`organiza-checksums.txt`)
            
            ### Verification
            All binaries have been built reproducibly in CI with analyzer and test suite verification.
