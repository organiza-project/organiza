name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test assembleDebug

  # Windows (ADR-0027): the tests that call Windows itself, and the MSI installer.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:desktop:test --tests '*WindowsLiveTest*' :app:desktop:packageMsi
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: organiza-msi
          path: app/desktop/build/compose/binaries/main/msi/*.msi
